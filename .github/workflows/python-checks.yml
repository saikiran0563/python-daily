name: Python Checks

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile Python files
        run: python -m compileall . -q

      - name: Run available tests
        run: |
          if [ -f Week_2/test_weather_cli.py ]; then
            python -m unittest Week_2/test_weather_cli.py
          fi
